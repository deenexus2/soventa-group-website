<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="SOVENTA GROUP - Building Solutions. Creating Opportunities. Advancing Communities.">

    <title>{% block title %}SOVENTA GROUP | Building Solutions{% endblock %}</title>

    <link rel="icon"
          href="{{ url_for('static', filename='images/logo.jpeg') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <header class="header">

        <div class="container navbar">

            <a href="{{ url_for('home') }}" class="logo">

                <img
                    src="{{ url_for('static', filename='images/logo.jpeg') }}"
                    alt="SOVENTA GROUP Logo"
                >

                <span>SOVENTA <strong>GROUP</strong></span>

            </a>


            <button class="menu-toggle"
                    id="menuToggle"
                    aria-label="Open navigation"
                    aria-expanded="false">

                ☰

            </button>


            <nav class="nav-links" id="navLinks">

                <a href="{{ url_for('home') }}">Home</a>

                <a href="{{ url_for('home') }}#about">About</a>

                <a href="{{ url_for('home') }}#services">Services</a>

                <a href="{{ url_for('home') }}#portfolio">Portfolio</a>

                <a href="{{ url_for('home') }}#contact"
                   class="nav-button">
                    Contact Us
                </a>

            </nav>

        </div>

    </header>


    <main>

        {% block content %}{% endblock %}

    </main>


    <footer class="footer">

        <div class="container footer-content">

            <div class="footer-brand">

                <h2>SOVENTA GROUP</h2>

                <p>
                    Building Solutions. Creating Opportunities.
                    Advancing Communities.
                </p>

            </div>


            <div class="footer-links">

                <h3>Quick Links</h3>

                <a href="{{ url_for('home') }}">Home</a>

                <a href="{{ url_for('home') }}#about">About</a>

                <a href="{{ url_for('home') }}#services">Services</a>

                <a href="{{ url_for('home') }}#contact">Contact</a>

            </div>


            <div class="footer-contact">

                <h3>Contact</h3>

                <p>08148795655</p>

                <p>09060050335</p>

                <p>Nigeria</p>

            </div>

        </div>


        <div class="footer-bottom">

            <p>
                &copy; <span id="year"></span>
                SOVENTA GROUP. All Rights Reserved.
            </p>

        </div>

    </footer>


    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
